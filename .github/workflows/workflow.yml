name: Node CI
on: [push, pull_request]
jobs:
  ubuntu-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
    - uses: actions/checkout@master
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@master
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install Groonga
      run: |
        sudo apt install -y -V ca-certificates lsb-release wget
        wget https://packages.groonga.org/ubuntu/groonga-apt-source-latest-$(lsb_release --codename --short).deb
        sudo apt install -y -V ./groonga-apt-source-latest-$(lsb_release --codename --short).deb
        sudo apt update
        sudo apt-get install -y -V \
          groonga-normalizer-mysql \
          groonga-tokenizer-mecab \
          libgroonga0
    - name: npm install and test
      run: |
        npm ci
        npm test

  windows-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
    - uses: actions/checkout@master
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@master
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install Groonga
      shell: cmd
      run: |
        set ARCHIVE=groonga-latest-x64-vs2022.zip

        choco install -y curl 7zip.commandline
        curl -OL https://packages.groonga.org/windows/groonga/%ARCHIVE%
        7z x %ARCHIVE%
        del %ARCHIVE%
        move groonga-* ..\groonga
    - run: npm i -g node-gyp
    - name: Install Nroonga
      shell: cmd
      run: |
        set GROONGA_PATH=%GITHUB_WORKSPACE%\..\groonga
        npm ci
    - name: Run test
      shell: cmd
      run: |
        set GROONGA_PATH=%GITHUB_WORKSPACE%\..\groonga
        npm test

  macos-test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]
    steps:
    - uses: actions/checkout@master
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@master
      with:
        node-version: ${{ matrix.node-version }}
    - run: brew install groonga pkg-config
    - run: pip install setuptools
    - name: npm install and test
      run: |
        npm ci
        npm test
      env:
        PKG_CONFIG_PATH: /usr/local/opt/groonga/lib/pkgconfig
